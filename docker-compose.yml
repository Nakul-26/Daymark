services:
  daymark:
    build: .
    restart: unless-stopped
    environment:
      PASSWORD: ${PASSWORD:?set PASSWORD in .env or the Dokploy Environment tab}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ_DEFAULT: ${TZ_DEFAULT:-Asia/Kolkata}
    volumes:
      - daymark-data:/data    # database + backups: back this volume up
    expose:
      - "3000"                # Dokploy: Domains tab -> service daymark, port 3000

volumes:
  daymark-data:
